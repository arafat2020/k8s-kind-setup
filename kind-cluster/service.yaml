apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort
  selector:
    app: my-app-label # Must match your Pod's label
  ports:
    - protocol: TCP
      port: 8080      # The port inside the container
      targetPort: 8080 
      nodePort: 30080 # A manual external port choice (between 30000-32767)
